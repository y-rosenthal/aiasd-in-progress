# This _quarto.yml file uses several extra files (listed below) that
# aren't part of the standard _quarto.yml file.
# My other quarto projects also use the same files. 
# Therefore I used a -v001 extension on the filenames so that 
# if I modify these files, I should also modify the extension. 
# That gives me a quick and easy way to make sure that I also 
# update other book projects that I have with the latest versions
# of these files.
#
#   yrBuildQuarto-v001.sh
#   yrChapterNumber-v001.sh 
#   yrNocacheHeaders-v001.html
#   yrstuff-v001.js
#   yrStyles-main-v001.css
#   yrStyles-f26-v001.css        (Fall 2026: practice questions, "As of" badges)
#   yrAnswerToggles-v001.html    (Fall 2026: Show/Hide all answers bars; no longer included, yrCollapsibles replaced them)
#   yrCollapsibles-v003.html     (Fall 2026: .yr-explain boxes; Expand/Collapse (filled), Expand All, Collapse All buttons on every collapsible callout)
#   yrNewTabLinks-v001.html      (Fall 2026: links to other pages open in a new tab)
#   yrWaysTabs-v002.html         (Fall 2026: .yr-ways tabsets for several ways to do one thing; Show all after the last tab, Show as tabs in each way)
#   yrLinkTargetHighlight-v001.html (Fall 2026: the target of a link to a section (page#id) gets an amber background that fades out)
#   yrUpdateCheck-v001.html     (Fall 2026: when the published page is newer than the copy on screen, reload or show a Reload bar)

project:
  type: book
  output-dir: _book
  pre-render: copy_quartoYml_to_bookFolder-v001.R
  resources:
    - /_quarto.yml   # leading "/": only the top-level file, not _yr/*/_quarto.yml
    - yrNocacheHeaders-v001.html
    - yrstuff-v001.js
    - .nojekyll
    - taskApp-setupWorksheet-v001.xlsx   # download on the Class 10 page
    - taskApp-setupScreenshots-v001.docx # download on the Class 10 page (screenshot log template)

